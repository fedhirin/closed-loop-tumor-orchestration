[build-system]
requires = ["setuptools==69.0.3", "wheel==0.42.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tumor-orchestration"
version = "1.0.0"
requires-python = ">=3.10,<3.12"
dependencies = [
  "torch==2.1.2",
  "torchvision==0.16.2",
  "numpy==1.26.3",
  "scipy==1.11.4",
  "scikit-learn==1.4.0",
  "pandas==2.1.4",
  "PyYAML==6.0.1",
  "nibabel==5.2.0",
]

[project.scripts]
tumor-train = "tumor_orchestration.commands:train_main"
tumor-evaluate = "tumor_orchestration.commands:evaluate_main"

[tool.setuptools]
package-dir = {"" = "code"}

[tool.setuptools.packages.find]
where = ["code"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["tumor_orchestration"]
mypy_path = "code"
